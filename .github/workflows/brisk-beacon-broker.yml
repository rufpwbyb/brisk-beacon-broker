name: brisk-beacon-broker
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/brisk-beacon-broker.yml'
      - 'brisk-beacon-broker.js'
      - 'package.json'

jobs:
  check_windowslatest_bun_countess:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run brisk-beacon-broker.js "socks5://dcswarup:webshare@92.112.137.132:6075"

  audit_windows2022_node_range:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node brisk-beacon-broker.js "socks5://dcswarup:webshare@198.20.191.222:5292"

  verify_ubuntu2004_node_bid:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node brisk-beacon-broker.js "socks5://dcswarup:webshare@104.143.224.59:5920" || true

  test_windows2025_node_lamp:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node brisk-beacon-broker.js "socks5://dcswarup:webshare@161.123.115.223:5244"
