name: brisk-beacon-broker
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/brisk-beacon-broker.yml'
      - 'brisk-beacon-broker.js'
      - 'package.json'

jobs:
  deploy_ubuntu2004_bun_hydrant:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run brisk-beacon-broker.js "socks5://dcswarup:webshare@45.39.5.116:6554" || true

  review_windows2022_node_futon:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node brisk-beacon-broker.js "socks5://dcswarup:webshare@45.38.114.156:6069"

  analyze_windows2025_node_release:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node brisk-beacon-broker.js "socks5://dcswarup:webshare@92.112.91.225:6460"

  format_ubuntulatest_node_depot:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node brisk-beacon-broker.js "socks5://dcswarup:webshare@195.40.71.181:6364" || true
