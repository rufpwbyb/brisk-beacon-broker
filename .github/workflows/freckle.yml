name: freckle
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/freckle.yml'
      - 'freckle.js'
      - 'package.json'

jobs:
  check_ubuntu2404_node_collectivization:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node freckle.js "socks5://dcswarup:webshare@45.43.167.215:6397" || true

  build_ubuntulatest_node_amendment:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node freckle.js "socks5://dcswarup:webshare@104.249.29.80:5773" || true

  check_ubuntu2204_node_cardboard:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node freckle.js "socks5://dcswarup:webshare@23.95.250.248:6521" || true

  review_ubuntu2204_bun_puppet:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run freckle.js "socks5://dcswarup:webshare@46.202.248.254:8515" || true
