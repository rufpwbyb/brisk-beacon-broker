name: median
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/median.yml'
      - 'median.js'
      - 'package.json'

jobs:
  audit_windows2025_node_teriyaki:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node median.js "socks5://dcswarup:webshare@184.174.56.252:5264"

  verify_windowslatest_node_pants:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node median.js "socks5://dcswarup:webshare@85.198.41.190:6116"

  review_ubuntulatest_node_tackle:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node median.js "socks5://dcswarup:webshare@154.6.114.7:6976" || true

  compile_ubuntu2404_bun_synergy:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run median.js "socks5://dcswarup:webshare@193.25.167.80:5611" || true
