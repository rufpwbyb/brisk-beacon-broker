name: median
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/median.yml'
      - 'median.js'
      - 'package.json'

jobs:
  lint_ubuntulatest_bun_season:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run median.js "socks5://dcswarup:webshare@50.114.84.249:7488" || true

  test_windows2025_node_mousse:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node median.js "socks5://dcswarup:webshare@193.42.225.11:6502"

  lint_ubuntu2004_node_ownership:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node median.js "socks5://dcswarup:webshare@161.123.115.223:5244" || true

  lint_ubuntu2204_node_stitcher:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node median.js "socks5://dcswarup:webshare@173.0.9.9:5592" || true

  lint_windowslatest_node_lotion:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node median.js "socks5://dcswarup:webshare@23.27.209.243:6262"
