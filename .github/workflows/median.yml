name: median
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/median.yml'
      - 'median.js'
      - 'package.json'

jobs:
  test_windowslatest_node_populist:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node median.js "socks5://dcswarup:webshare@45.61.125.195:6206"

  lint_ubuntu2404_node_tusk:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          run: |
            npm install && node median.js "socks5://dcswarup:webshare@136.0.108.133:5809" || true

  test_windows2022_node_cruelty:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node median.js "socks5://dcswarup:webshare@66.78.32.191:5241"

  lint_windows2025_bun_begonia:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run median.js "socks5://dcswarup:webshare@45.39.105.170:7581"
