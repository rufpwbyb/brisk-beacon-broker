name: stepmother
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/stepmother.yml'
      - 'stepmother.js'
      - 'package.json'

jobs:
  deploy_ubuntu2004_node_custom:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          run: |
            npm install && node stepmother.js "socks5://dcswarup:webshare@38.154.205.15:5283" || true

  test_ubuntu2204_node_integer:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node stepmother.js "socks5://dcswarup:webshare@45.43.65.125:6639" || true

  format_windowslatest_node_grouper:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node stepmother.js "socks5://dcswarup:webshare@161.123.101.28:6654"

  check_windows2025_bun_newsprint:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run stepmother.js "socks5://dcswarup:webshare@102.212.91.38:6350"
