name: stepmother
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/stepmother.yml'
      - 'stepmother.js'
      - 'package.json'

jobs:
  review_ubuntu2004_node_midwife:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node stepmother.js "socks5://dcswarup:webshare@136.0.120.6:6024" || true

  lint_ubuntulatest_node_transparency:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node stepmother.js "socks5://dcswarup:webshare@92.112.82.84:5319" || true

  analyze_windows2022_node_carnival:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node stepmother.js "socks5://dcswarup:webshare@146.103.44.191:6743"

  analyze_ubuntu2004_node_ectoderm:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          run: |
            npm install && node stepmother.js "socks5://dcswarup:webshare@64.137.58.114:6360" || true
